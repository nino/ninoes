name: CI

on:
   pull_request:
   push:
      branches: [main]

permissions:
   contents: read

concurrency:
   group: ci-${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   checks:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: pnpm/action-setup@v6
         - uses: actions/setup-node@v7
           with:
              node-version: 26
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         - run: pnpm typecheck
         - run: pnpm lint
         - run: pnpm test
         - run: pnpm build
