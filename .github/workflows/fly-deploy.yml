# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
   push:
      branches:
         - main
   workflow_dispatch:

permissions:
   contents: read

jobs:
   deploy:
      name: Deploy app
      runs-on: ubuntu-latest
      concurrency: deploy-group # optional: ensure only one action runs at a time
      steps:
         - uses: actions/checkout@v7
         - uses: superfly/flyctl-actions/setup-flyctl@master
         - run: flyctl deploy --remote-only --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" --build-arg VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}" --build-arg VITE_POSTHOG_KEY="$POSTHOG_KEY" --build-arg VITE_POSTHOG_HOST="$POSTHOG_HOST"
           env:
              FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
              # PostHog project keys are public (they only allow sending
              # events), so they live here rather than in secrets. Production
              # only: PR previews send nothing.
              POSTHOG_KEY: phc_khU8oAxkqoNVCHp5euLyyWCQ4W3sBAMrJnTtZGKgcWwA
              POSTHOG_HOST: https://eu.i.posthog.com
