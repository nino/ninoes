version: 2
updates:
   - package-ecosystem: "bun"
     directory: "/"
     schedule:
        interval: "weekly"
     open-pull-requests-limit: 10
     versioning-strategy: "auto"
     commit-message:
        prefix: "chore"
        prefix-development: "chore"
        include: "scope"
     groups:
        # React refuses to run when react and react-dom differ, so bump them together.
        react:
           patterns:
              - "react"
              - "react-dom"
              - "@types/react"
              - "@types/react-dom"

   - package-ecosystem: "github-actions"
     directory: "/"
     schedule:
        interval: "weekly"
     open-pull-requests-limit: 10
     commit-message:
        prefix: "chore"
        include: "scope"
