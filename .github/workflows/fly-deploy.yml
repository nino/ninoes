# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
   push:
      branches:
         - main
   workflow_dispatch:

permissions:
   contents: read

jobs:
   deploy:
      name: Deploy app
      runs-on: ubuntu-latest
      concurrency: deploy-group # optional: ensure only one action runs at a time
      steps:
         - uses: actions/checkout@v7
         # Pinned to a commit SHA, not @master: this step runs in the same job
         # as FLY_API_TOKEN, so a mutable upstream ref would let anyone with
         # commit rights on superfly/flyctl-actions run code next to the token.
         # ed8efb3 is tag v1 as of 2026-08-15. Bump deliberately.
         - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
         - run: flyctl deploy --remote-only --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" --build-arg VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
           env:
              FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
